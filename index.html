<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comedor San Vicente - Control Financiero</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    color:#222;
}

header{
    background:#0f766e;
    color:#fff;
    padding:16px;
    text-align:center;
}

.wrap{
    padding:20px;
    max-width:1300px;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:16px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#0f766e;
}

input,
select,
button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
    font-size:14px;
}

button{
    background:#0f766e;
    color:#fff;
    border:none;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    opacity:.9;
    transform:scale(1.01);
}

.btn-danger{
    background:#dc2626;
}

.btn-save{
    background:#2563eb;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0f766e;
    color:white;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.kpi{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.ingreso{
    color:#15803d;
    font-weight:bold;
}

.egreso{
    color:#dc2626;
    font-weight:bold;
}

.deuda{
    color:#b45309;
    font-weight:bold;
}

.small{
    font-size:12px;
    color:#666;
}

.footer{
    text-align:center;
    padding:15px;
    color:#666;
    font-size:13px;
}

</style>
</head>

<body>

<header>
    <h1>COMEDOR SAN VICENTE</h1>
    <div>Sistema de Control Financiero</div>
</header>

<div class="wrap">

    <div class="grid">

        <!-- RESUMEN -->
        <div class="card">

            <h2>Resumen General</h2>

            <div>Ingresos Totales</div>
            <div class="kpi ingreso" id="totalIngresos">
                S/ 0.00
            </div>

            <div>Egresos Totales</div>
            <div class="kpi egreso" id="totalEgresos">
                S/ 0.00
            </div>

            <div>Deudas Totales</div>
            <div class="kpi deuda" id="totalDeudas">
                S/ 0.00
            </div>

            <div>Balance General</div>
            <div class="kpi" id="balance">
                S/ 0.00
            </div>

        </div>

        <!-- REGISTRO -->
        <div class="card">

            <h2>Registrar Movimiento</h2>

            <!-- TIPO -->
            <select id="tipo">

                <option value="">
                    Seleccione Tipo
                </option>

                <option value="ingreso">
                    Ingreso
                </option>

                <option value="egreso">
                    Egreso
                </option>

                <option value="deuda">
                    Deuda
                </option>

            </select>

            <!-- CATEGORÍA -->
            <select id="categoria">

                <option value="">
                    Seleccione Categoría
                </option>

                <optgroup label="Ingresos">

                    <option value="Ingreso Compras Mercado">
                        Ingreso por Compras de Mercado
                    </option>

                </optgroup>

                <optgroup label="Servicios">

                    <option value="Refrigerio">
                        Refrigerio
                    </option>

                    <option value="Recreo">
                        Recreo
                    </option>

                    <option value="Almuerzo">
                        Almuerzo
                    </option>

                </optgroup>

            </select>

            <!-- DESCRIPCIÓN -->
            <input
                type="text"
                id="descripcion"
                placeholder="Descripción del movimiento"
            >

            <!-- MONTO -->
            <input
                type="number"
                id="monto"
                step="0.01"
                placeholder="Monto"
            >

            <!-- BOTONES -->
            <button
                class="btn-save"
                onclick="guardarMovimiento()"
            >
                Guardar Datos
            </button>

            <button
                class="btn-danger"
                onclick="borrarDatos()"
            >
                Borrar Todos los Datos
            </button>

        </div>

    </div>

    <!-- TABLA -->
    <div class="card" style="margin-top:20px;">

        <h2>Movimientos Registrados</h2>

        <table>

            <thead>

                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Categoría</th>
                    <th>Descripción</th>
                    <th>Monto</th>
                </tr>

            </thead>

            <tbody id="tablaMovimientos"></tbody>

        </table>

    </div>

</div>

<div class="footer">
    Sistema Financiero - Comedor San Vicente
</div>

<script>

/* =========================
   BASE LOCAL
========================= */

const db = JSON.parse(
    localStorage.getItem('comedor_finanzas')
) || {
    movimientos:[]
};

/* =========================
   GUARDAR LOCALSTORAGE
========================= */

function save(){

    localStorage.setItem(
        'comedor_finanzas',
        JSON.stringify(db)
    );

    render();
}

/* =========================
   FECHA
========================= */

function hoy(){

    return new Date().toLocaleDateString();
}

/* =========================
   AUTOSELECCIÓN
========================= */

document.getElementById('categoria')
.addEventListener('change', function(){

    const categoria = this.value;

    if(categoria === 'Ingreso Compras Mercado'){

        document.getElementById('tipo').value =
            'ingreso';
    }
});

/* =========================
   GUARDAR MOVIMIENTO
========================= */

function guardarMovimiento(){

    const tipo =
        document.getElementById('tipo').value;

    const categoria =
        document.getElementById('categoria').value;

    const descripcion =
        document.getElementById('descripcion').value;

    const monto =
        parseFloat(
            document.getElementById('monto').value
        );

    if(
        !tipo ||
        !categoria ||
        !descripcion ||
        !monto
    ){

        alert("Complete todos los campos");

        return;
    }

    db.movimientos.unshift({

        fecha:hoy(),
        tipo,
        categoria,
        descripcion,
        monto

    });

    save();

    limpiarFormulario();

    alert("Movimiento registrado correctamente");
}

/* =========================
   LIMPIAR FORMULARIO
========================= */

function limpiarFormulario(){

    document.getElementById('tipo').value='';

    document.getElementById('categoria').value='';

    document.getElementById('descripcion').value='';

    document.getElementById('monto').value='';
}

/* =========================
   BORRAR DATOS
========================= */

function borrarDatos(){

    if(
        confirm(
            "¿Desea eliminar todos los datos?"
        )
    ){

        db.movimientos = [];

        save();
    }
}

/* =========================
   RENDER
========================= */

function render(){

    let ingresos = 0;
    let egresos = 0;
    let deudas = 0;

    db.movimientos.forEach(m => {

        if(m.tipo === 'ingreso'){

            ingresos += m.monto;
        }

        if(m.tipo === 'egreso'){

            egresos += m.monto;
        }

        if(m.tipo === 'deuda'){

            deudas += m.monto;
        }
    });

    document.getElementById(
        'totalIngresos'
    ).textContent =
        'S/ ' + ingresos.toFixed(2);

    document.getElementById(
        'totalEgresos'
    ).textContent =
        'S/ ' + egresos.toFixed(2);

    document.getElementById(
        'totalDeudas'
    ).textContent =
        'S/ ' + deudas.toFixed(2);

    document.getElementById(
        'balance'
    ).textContent =
        'S/ ' +
        (ingresos - egresos - deudas)
        .toFixed(2);

    document.getElementById(
        'tablaMovimientos'
    ).innerHTML =

        db.movimientos.map(m => `

            <tr>

                <td>${m.fecha}</td>

                <td>
                    ${m.tipo.toUpperCase()}
                </td>

                <td>
                    ${m.categoria}
                </td>

                <td>
                    ${m.descripcion}
                </td>

                <td>
                    S/ ${m.monto.toFixed(2)}
                </td>

            </tr>

        `).join('');
}

/* =========================
   INICIO
========================= */

render();

</script>

</body>
</html>
